name: Sync External Sources

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Tier 1 Sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Sync all Tier 1 sources
        run: node packages/core/dist/index.js sync --all --output .sources/

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain .sources/)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-sources
          commit-message: 'chore: sync external adversarial prompt sources'
          title: 'chore: sync external adversarial prompt sources'
          body: |
            Automated daily sync of Tier 1 external sources:
            - JailbreakBench
            - Awesome-Jailbreak-on-LLMs
            - Jailbreak LLMs
          labels: automated, sources
